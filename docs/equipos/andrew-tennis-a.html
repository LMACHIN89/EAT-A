<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrew Tennis A — 6ta Masculino | Scouting</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      --primary: #0f2c59;
      --primary-soft: #e8eef8;
      --accent: #16a34a;
      --accent-soft: #dcfce7;
      --accent-text: #166534;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --danger-text: #991b1b;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --warn-text: #92400e;
      --info: #0284c7;
      --info-soft: #e0f2fe;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(15, 23, 42, 0.04);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .container { max-width: 1140px; margin: 0 auto; padding: 16px 16px 64px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; flex-wrap: wrap; gap: 8px; }
    .back-link { text-decoration: none; color: var(--primary); font-weight: 700; background: var(--surface); border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; transition: all 0.15s ease; }
    .back-link:hover { background: var(--primary-soft); border-color: var(--primary); }

    /* Global Season Switcher Bar */
    .season-bar {
      position: sticky; top: 8px; z-index: 60;
      background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(10px);
      border: 1px solid var(--border-strong); border-radius: 14px;
      padding: 10px 14px; margin-bottom: 18px; box-shadow: 0 6px 20px rgba(15, 44, 89, 0.09);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    }
    .season-bar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .season-label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.6px; color: var(--primary); }
    .season-pills { display: inline-flex; flex-wrap: wrap; gap: 6px; }
    .season-btn {
      border: 1px solid var(--border-strong); background: var(--surface-alt); color: var(--text-muted);
      padding: 6px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 700; cursor: pointer;
      transition: all 0.15s ease;
    }
    .season-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
    .season-btn.active { background: var(--primary); border-color: var(--primary); color: #ffffff; box-shadow: 0 2px 8px rgba(15, 44, 89, 0.25); }
    .season-btn.all-btn.active { background: #334155; border-color: #334155; }

    .season-indicator { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .season-indicator strong { color: var(--primary); }
    .season-warn-pill { background: var(--warn-soft); color: var(--warn-text); padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }

    .hero { background: linear-gradient(135deg, #0b1f3f 0%, #153a6e 100%); color: #ffffff; border-radius: 16px; padding: 26px 26px 22px; box-shadow: 0 10px 28px rgba(11, 31, 63, 0.18); margin-bottom: 16px; }
    .hero-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
    .monogram { width: 58px; height: 58px; border-radius: 14px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.25); display: flex; align-items: center; justify-content: center; font-size: 21px; font-weight: 800; letter-spacing: 0.5px; flex-shrink: 0; }
    .hero-meta-top { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #93c5fd; font-weight: 700; margin-bottom: 4px; }
    .hero h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; line-height: 1.15; margin-bottom: 6px; }
    .hero-sub { font-size: 13px; color: #cbd5e1; }

    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .kpi-card { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 10px; padding: 13px 15px; }
    .kpi-value { font-size: clamp(22px, 2.5vw, 28px); font-weight: 800; line-height: 1.1; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .kpi-label { font-size: 12px; color: #cbd5e1; }
    .hero-summary { font-size: 13.5px; color: #e2e8f0; background: rgba(0, 0, 0, 0.18); border-radius: 10px; padding: 12px 16px; border-left: 3px solid #60a5fa; }

    .quick-nav {
      background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
      padding: 6px 10px; display: flex; gap: 6px; overflow-x: auto;
      box-shadow: var(--shadow); margin-bottom: 20px; scrollbar-width: none;
    }
    .quick-nav::-webkit-scrollbar { display: none; }
    .quick-nav a { text-decoration: none; color: var(--text-muted); font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
    .quick-nav a:hover { background: var(--primary-soft); color: var(--primary); }
    .quick-nav a.nav-cta { background: var(--accent-soft); color: var(--accent-text); font-weight: 700; }

    .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .section-header { margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 10px; }
    .section h2 { font-size: 19px; font-weight: 800; color: var(--primary); letter-spacing: -0.2px; }
    .section-subtitle { font-size: 13px; color: var(--text-light); margin-top: 2px; }

    .insight-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .insight-card { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; border-top: 3px solid var(--primary); }
    .insight-card.tone-positive { border-top-color: var(--accent); }
    .insight-card.tone-warn { border-top-color: var(--warn); }
    .insight-card.tone-info { border-top-color: var(--info); }
    .insight-kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-light); margin-bottom: 4px; }
    .insight-headline { font-size: 14.5px; font-weight: 700; color: var(--text); margin-bottom: 6px; line-height: 1.3; }
    .insight-body { font-size: 13px; color: var(--text-muted); line-height: 1.45; }

    .tactical-box { background: #f8fafc; border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
    .alert-banner { background: var(--warn-soft); border: 1px solid #fcd34d; color: var(--warn-text); border-radius: 10px; padding: 12px 15px; font-size: 13.5px; margin-bottom: 16px; }

    /* Matchup Predictor & Simulator */
    .probable-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
    .prob-card { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border-top: 3px solid var(--primary); }
    .prob-card.threat-high { border-top-color: var(--danger); }
    .prob-card.threat-mid { border-top-color: var(--warn); }
    .prob-card.threat-low { border-top-color: var(--accent); }
    .prob-top { display: flex; justify-content: space-between; align-items: center; }
    .prob-pair { font-size: 13.5px; font-weight: 800; color: var(--text); line-height: 1.25; }
    .prob-meta { font-size: 11.5px; color: var(--text-muted); }
    .prob-alt { font-size: 11px; color: var(--text-light); border-top: 1px dashed var(--border); padding-top: 6px; margin-top: auto; }

    .sim-box { background: #f8fafc; border: 1px solid var(--border-strong); border-radius: 12px; padding: 18px; }
    .sim-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
    .sim-summary-pill { background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 10px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .sim-score-big { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sim-controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); padding: 7px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all 0.15s ease; }
    .btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: #153a6e; color: #fff; }
    .btn-green { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-green:hover { background: #15803d; color: #fff; }

    .sim-row { display: grid; grid-template-columns: 52px 1.15fr 1.35fr 165px; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .sim-select { width: 100%; padding: 6px 8px; border: 1px solid var(--border-strong); border-radius: 7px; font-size: 12.5px; font-family: var(--font); background: #fff; }
    .sim-pair-selectors { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .sim-pred { text-align: right; font-size: 12px; }
    .sim-prob-bar { height: 7px; background: var(--danger-soft); border-radius: 999px; overflow: hidden; margin: 4px 0; }
    .sim-prob-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.2s ease; }
    .h2h-mini { font-size: 11px; color: var(--info); font-weight: 600; margin-top: 2px; }

    /* Mini Bracket Strip */
    .bracket-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
    .bk-card { min-width: 220px; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; flex-shrink: 0; }
    .bk-card.bk-own { border: 2px solid var(--accent); background: #f0fdf4; }
    .bk-stage { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--primary); display: flex; justify-content: space-between; margin-bottom: 6px; }
    .bk-team { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
    .bk-team.win { font-weight: 800; color: var(--accent-text); }

    /* Match Cards */
    .h2h-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 14px; }
    .match-card { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .match-card-head { background: var(--surface-alt); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .match-card-title { font-size: 13.5px; font-weight: 700; color: var(--primary); }
    .scoreboard-banner { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; }
    .score-pill { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; padding: 2px 9px; border-radius: 6px; font-variant-numeric: tabular-nums; font-size: 14px; }
    .score-pill.win { background: var(--accent-soft); color: var(--accent-text); }
    .score-pill.loss { background: var(--danger-soft); color: var(--danger-text); }

    .doubles-list { width: 100%; border-collapse: collapse; font-size: 13px; }
    .doubles-list tr { border-bottom: 1px solid var(--border); }
    .doubles-list tr:last-child { border-bottom: none; }
    .doubles-list td { padding: 10px 12px; vertical-align: middle; }
    .pos-badge { display: inline-block; font-family: var(--mono); font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); text-align: center; min-width: 34px; }
    .pair-name { font-weight: 600; color: var(--text); }
    .pair-name.winner { color: var(--accent-text); }
    .sets-cell { font-family: var(--mono); font-weight: 700; text-align: center; white-space: nowrap; font-size: 12.5px; }
    .set-chip { display: inline-block; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; margin: 0 2px; }
    .set-chip.stb { background: var(--warn-soft); border-color: #fcd34d; color: var(--warn-text); }
    .res-badge { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 6px; font-size: 11.5px; font-weight: 800; }
    .res-badge.V { background: var(--accent-soft); color: var(--accent-text); }
    .res-badge.D { background: var(--danger-soft); color: var(--danger-text); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    table.data-table th { background: var(--surface-alt); color: var(--text-muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    table.data-table th.sortable { cursor: pointer; user-select: none; }
    table.data-table th.sortable:hover { color: var(--primary); background: var(--primary-soft); }
    table.data-table td { padding: 11px 14px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
    table.data-table tr:last-child td { border-bottom: none; }
    tr.highlight-scout td { background: #eff6ff; font-weight: 700; }
    tr.highlight-own td { background: #f0fdf4; font-weight: 700; }
    .num { text-align: right; }
    .center { text-align: center; }

    .tabs-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .jornada-tab { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px; cursor: pointer; text-align: left; transition: all 0.15s ease; min-width: 145px; flex: 1 1 155px; max-width: 220px; }
    .jornada-tab:hover { border-color: var(--primary); background: var(--primary-soft); }
    .jornada-tab.active { background: var(--primary); border-color: var(--primary); color: #ffffff; box-shadow: 0 4px 12px rgba(15, 44, 89, 0.22); }
    .jornada-tab-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; margin-bottom: 3px; }
    .jornada-tab-opp { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .jornada-tab-date { font-size: 11px; opacity: 0.78; margin-top: 2px; }
    .tab-pill { font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 5px; }
    .tab-pill.V { background: var(--accent-soft); color: var(--accent-text); }
    .tab-pill.D { background: var(--danger-soft); color: var(--danger-text); }
    .jornada-tab.active .tab-pill.V { background: rgba(34, 197, 94, 0.28); color: #dcfce7; }
    .jornada-tab.active .tab-pill.D { background: rgba(239, 68, 68, 0.28); color: #fee2e2; }

    .search-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .search-input { flex: 1; min-width: 220px; padding: 9px 14px; border: 1px solid var(--border-strong); border-radius: 8px; font-size: 13.5px; font-family: var(--font); outline: none; }
    .search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(15, 44, 89, 0.1); }

    .player-row { cursor: pointer; transition: background 0.12s ease; }
    .player-row:hover td { background: #f8fafc; }
    .player-row.expanded td { background: var(--primary-soft); border-bottom-color: transparent; }
    .chevron { display: inline-block; transition: transform 0.2s ease; font-weight: 800; color: var(--text-light); }
    .player-row.expanded .chevron { transform: rotate(90deg); color: var(--primary); }
    .player-detail-row { display: none; }
    .player-detail-row.open { display: table-row; }
    .player-detail-cell { background: #fafcff; padding: 0 !important; border-bottom: 2px solid var(--primary-soft) !important; }
    .player-drawer { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
    .cta-box { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--info); border-radius: 8px; padding: 12px 14px; font-size: 13px; }
    .cta-box.unverified { border-left-color: var(--warn); background: #fffdf7; }
    .cta-box h4 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-light); margin-bottom: 6px; }
    .partner-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--primary-soft); color: var(--primary); font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 8px; width: fit-content; }
    .history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-item { display: grid; grid-template-columns: 30px 150px 135px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; }

    .eff-bar-wrap { display: flex; align-items: center; gap: 8px; }
    .eff-bar-track { width: 64px; height: 7px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .eff-bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
    .eff-bar-fill.mid { background: var(--warn); }
    .eff-bar-fill.low { background: var(--danger); }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .subcard { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .subcard h3 { font-size: 14.5px; font-weight: 800; color: var(--primary); margin-bottom: 12px; }
    .pos-bar-row { margin-bottom: 12px; }
    .pos-bar-row:last-child { margin-bottom: 0; }
    .pos-bar-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
    .pos-track { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .pos-fill { height: 100%; background: linear-gradient(90deg, #1d4ed8, #16a34a); border-radius: 999px; }
    .pos-note { font-size: 11.5px; color: var(--text-light); margin-top: 3px; }

    .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .tag-fixed { background: var(--primary-soft); color: var(--primary); }
    .tag-unbeaten { background: var(--accent-soft); color: var(--accent-text); }
    .tag-danger { background: var(--danger-soft); color: var(--danger-text); }
    .tag-warn { background: var(--warn-soft); color: var(--warn-text); }
    .tag-rot { background: #f1f5f9; color: var(--text-muted); }
    .tag-cta { background: var(--info-soft); color: #0369a1; }
    .hm-cell { text-align: center; font-weight: 700; font-size: 12.5px; border-radius: 6px; }
    .footnote { font-size: 12.5px; color: var(--text-light); margin-top: 10px; }
    .footer { text-align: center; font-size: 12px; color: var(--text-light); margin-top: 32px; }

    @media (max-width: 960px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .insight-grid { grid-template-columns: 1fr 1fr; }
      .probable-grid { grid-template-columns: repeat(2, 1fr); }
      .sim-row { grid-template-columns: 1fr; }
      .sim-pred { text-align: left; }
      .two-col { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .hero { padding: 20px 16px; }
      .section { padding: 18px 14px; }
      .insight-grid, .probable-grid { grid-template-columns: 1fr; }
      .history-item { grid-template-columns: 28px 1fr; gap: 6px; }
      .doubles-list td { padding: 8px 6px; font-size: 12px; }
    }
    @media print { .quick-nav, .search-bar, .top-bar, .sim-controls, .season-bar { display: none !important; } body { background: #fff; } .section { box-shadow: none; break-inside: avoid; } }
  </style>
</head>
<body>

        // Wire Jornadas Tabs
        const jornadas = view.jornadas || [];
        if (activeJornadaIdx >= jornadas.length) activeJornadaIdx = 0;
        function drawJornadas() {
          const tabsEl = document.getElementById("jornada-tabs");
          const detailEl = document.getElementById("jornada-detail");
          tabsEl.innerHTML = jornadas.map((j, idx) => `
            <button class="jornada-tab ${idx === activeJornadaIdx ? "active" : ""}" data-idx="${idx}">
              <div class="jornada-tab-top"><span>${esc(j.round)}</span><span class="tab-pill ${j.result}">${j.result} ${j.score_for}–${j.score_against}</span></div>
              <div class="jornada-tab-opp">vs ${esc(j.opponent)}</div>
              <div class="jornada-tab-date">${esc(j.date)}${isHistorical ? " · " + esc(j.season) : ""}</div>
            </button>
          `).join("");
          tabsEl.querySelectorAll(".jornada-tab").forEach(b => b.addEventListener("click", () => {
            activeJornadaIdx = Number(b.dataset.idx);
            drawJornadas();
          }));
          detailEl.innerHTML = jornadas[activeJornadaIdx]
            ? renderMatchCard(jornadas[activeJornadaIdx], m.team_name)
            : `<p class="footnote">No hay jornadas registradas en ${esc(seasonLbl)}.</p>`;
        }
        drawJornadas();

        // Wire Players Table
        function drawPlayers() {
          const tbody = document.getElementById("players-tbody");
          const q = playerSearchText.trim().toLowerCase();
          let rows = [...(view.players || [])];
          if (q) {
            rows = rows.filter(p => [p.name, p.cedula, p.cta ? `${p.cta.club} ${p.cta.category}` : "", p.fixed_partner_note || "", p.tactical_note || ""].join(" ").toLowerCase().includes(q));
          }
          rows.sort((a, b) => {
            let va, vb;
            if (playerSortField === "name") { va = a.name; vb = b.name; }
            else if (playerSortField === "pj") { va = a.pj; vb = b.pj; }
            else if (playerSortField === "v") { va = a.v; vb = b.v; }
            else if (playerSortField === "elo") { va = a.elo || 0; vb = b.elo || 0; }
            else { va = a.eff; vb = b.eff; }
            if (va === vb) return (b.elo || 0) - (a.elo || 0);
            if (typeof va === "string") return playerSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
            return playerSortAsc ? va - vb : vb - va;
          });

          tbody.innerHTML = rows.map(p => {
            const isOpen = expandedPlayers.has(p.id);
            const ctaBadge = p.cta && p.cta.verified ? `<span class="tag tag-cta">${esc(p.cta.category)} · #${p.cta.ranking}</span>` : `<span class="tag tag-rot">Sin cruce</span>`;
            const ctaDetail = p.cta && p.cta.verified
              ? `<div class="cta-box"><h4>CTA · Perfil verificado (${esc(p.cta.match_method)})</h4><div><strong>Club:</strong> ${esc(p.cta.club)} · <strong>Categoría:</strong> ${esc(p.cta.category)} · <strong>Ranking CTA:</strong> #${p.cta.ranking} (${p.cta.points} pts)</div>${p.tactical_note ? `<div style="margin-top:6px;color:var(--text-muted)">${esc(p.tactical_note)}</div>` : ""}</div>`
              : `<div class="cta-box unverified"><h4>CTA · Club actual</h4><div>Cruce con CTA no verificado para este jugador.${p.tactical_note ? " " + esc(p.tactical_note) : ""}</div></div>`;
            const historyHtml = (p.history || []).map(h => `
              <div class="history-item">
                <span class="res-badge ${h.result}">${h.result}</span>
                <div><strong>${esc(h.round)}</strong><br><span style="color:var(--text-light)">${esc(h.date)} · ${esc(h.season)}</span></div>
                <div style="font-family:var(--mono);font-weight:700">${esc(h.score_str)}</div>
                <div><strong>vs ${esc(h.opp_pair)}</strong><div style="color:var(--text-light)">Compañero: <strong>${esc(h.partner)}</strong> · Rival: ${esc(h.rival_team)}</div></div>
                <span class="pos-badge">${esc(h.pos)}</span>
              </div>
            `).join("");

            return `
              <tr class="player-row ${isOpen ? "expanded" : ""}" data-pid="${esc(p.id)}">
                <td><strong>${esc(p.name)}</strong>${p.is_debutant ? ' <span class="tag tag-fixed">Debut</span>' : ""}</td>
                <td style="font-family:var(--mono);color:var(--text-muted)">${esc(p.cedula)}</td>
                <td>${ctaBadge}</td>
                <td class="num">${p.pj}</td>
                <td class="num">${p.v}</td>
                <td><div class="eff-bar-wrap"><div class="eff-bar-track"><div class="eff-bar-fill ${pctClass(p.eff)}" style="width:${p.eff.toFixed(0)}%"></div></div><strong>${p.eff.toFixed(0)}%</strong></div></td>
                <td class="num"><strong>${p.elo ? p.elo.toFixed(2) : "—"}</strong></td>
                <td class="center"><span class="chevron">›</span></td>
              </tr>
              <tr class="player-detail-row ${isOpen ? "open" : ""}">
                <td colspan="8" class="player-detail-cell">
                  <div class="player-drawer">
                    ${ctaDetail}
                    ${p.fixed_partner_note ? `<div class="partner-pill">🤝 ${esc(p.fixed_partner_note)}</div>` : ""}
                    <div>
                      <h4 style="font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-light);margin-bottom:8px">TOL — Historial en ${esc(seasonLbl)} (${(p.history||[]).length})</h4>
                      <div class="history-list">${historyHtml || '<p class="footnote">Sin partidos registrados en esta temporada.</p>'}</div>
                    </div>
                  </div>
                </td>
              </tr>
            `;
          }).join("") || `<tr><td colspan="8" class="center" style="color:var(--text-light)">No hay jugadores que coincidan con el filtro en ${esc(seasonLbl)}.</td></tr>`;

          tbody.querySelectorAll(".player-row").forEach(tr => tr.addEventListener("click", () => {
            const pid = tr.dataset.pid;
            if (expandedPlayers.has(pid)) expandedPlayers.delete(pid); else expandedPlayers.add(pid);
            drawPlayers();
          }));
        }
        drawPlayers();

        document.getElementById("player-search").addEventListener("input", (e) => { playerSearchText = e.target.value; drawPlayers(); });
        document.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
          const f = th.dataset.sort;
          if (playerSortField === f) playerSortAsc = !playerSortAsc; else { playerSortField = f; playerSortAsc = (f === "name"); }
          drawPlayers();
        }));

        // Wire Lineup Simulator
        if (!isOwnReport && document.getElementById("sim-rows")) {
          const ourRoster = (view.our_team_profile && view.our_team_profile.roster) || [];
          const ourPairsMap = (view.our_team_profile && view.our_team_profile.pair_stats) || {};
          const rivalPairs = matchup.all_rival_pairs || [];
          const slots = matchup.positions || [];

          const eloOf = (rosterArr, name) => {
            const found = rosterArr.find(x => x.name === name);
            return found ? (found.elo || 200) : 200;
          };
          const sortedOurs = [...ourRoster].sort((a, b) => (b.elo || 0) - (a.elo || 0) || (b.eff || 0) - (a.eff || 0));
          const makeTop5Pairs = () => {
            const res = [];
            for (let i = 0; i < 5; i++) {
              const p1 = sortedOurs[i * 2]?.name || sortedOurs[0]?.name || "Jugador A";
              const p2 = sortedOurs[i * 2 + 1]?.name || sortedOurs[1]?.name || "Jugador B";
              res.push([p1, p2]);
            }
            return res;
          };

          const basePairs = makeTop5Pairs();
          const simState = slots.map((slot, idx) => ({
            pos: slot.pos,
            rivalPair: slot.primary_pair,
            ourP1: basePairs[idx]?.[0] || "",
            ourP2: basePairs[idx]?.[1] || "",
          }));

          const rivalPairElo = (pairName) => {
            const found = rivalPairs.find(r => r.pair_name === pairName);
            if (found && found.avg_elo) return found.avg_elo;
            const sl = slots.find(s => s.primary_pair === pairName);
            return (sl && sl.avg_elo) ? sl.avg_elo : 210;
          };
          const rivalPairEff = (pairName) => {
            const found = rivalPairs.find(r => r.pair_name === pairName);
            return found ? found.eff : 50;
          };

          function winProb(ourP1, ourP2, rivPair) {
            const ourAvgElo = (eloOf(ourRoster, ourP1) + eloOf(ourRoster, ourP2)) / 2;
            const rivAvgElo = rivalPairElo(rivPair);
            const diff = ourAvgElo - rivAvgElo;
            let p = 1 / (1 + Math.pow(10, -diff / 110));
            const pk = [ourP1, ourP2].sort().join(" / ");
            if (ourPairsMap[pk] && ourPairsMap[pk].pj >= 2) {
              p = Math.max(0.08, Math.min(0.92, p + ((ourPairsMap[pk].eff - 50) / 100) * 0.08));
            }
            const rEff = rivalPairEff(rivPair);
            if (rEff >= 80) p = Math.max(0.08, p - 0.05);
            else if (rEff <= 35) p = Math.min(0.92, p + 0.05);
            return { prob: p, ourElo: ourAvgElo, rivElo: rivAvgElo, diff };
          }

          function seriesWinProb(probs) {
            let dp = [1, 0, 0, 0, 0, 0];
            for (const p of probs) {
              const next = [0, 0, 0, 0, 0, 0];
              for (let k = 0; k <= 5; k++) {
                next[k] += dp[k] * (1 - p);
                if (k + 1 <= 5) next[k + 1] += dp[k] * p;
              }
              dp = next;
            }
            return dp[3] + dp[4] + dp[5];
          }

          function checkH2H(ourP1, ourP2, rivPair) {
            const rivPlayers = rivPair.split(" / ").map(s => s.trim().toLowerCase());
            for (const hm of (view.h2h_matches || [])) {
              for (const d of (hm.doubles || [])) {
                const ourIn = (d.opp_pair || "").toLowerCase();
                const rivIn = (d.team_pair || "").toLowerCase();
                if ((ourIn.includes(ourP1.toLowerCase()) || ourIn.includes(ourP2.toLowerCase())) &&
                    rivPlayers.some(rp => rp && rivIn.includes(rp))) {
                  return `${d.result === "D" ? "Ganamos" : "Perdimos"} (${d.score_str})`;
                }
              }
            }
            return "";
          }

          function applySuggestion(mode) {
            const pairs = makeTop5Pairs();
            pairs.sort((a, b) => (eloOf(ourRoster, b[0]) + eloOf(ourRoster, b[1])) - (eloOf(ourRoster, a[0]) + eloOf(ourRoster, a[1])));
            const idxByThreat = [0, 1, 2, 3, 4].sort((i, j) => rivalPairElo(simState[j].rivalPair) - rivalPairElo(simState[i].rivalPair));
            if (mode === "mirror") {
              idxByThreat.forEach((slotIdx, rank) => { simState[slotIdx].ourP1 = pairs[rank][0]; simState[slotIdx].ourP2 = pairs[rank][1]; });
            } else {
              simState[idxByThreat[0]].ourP1 = pairs[4][0]; simState[idxByThreat[0]].ourP2 = pairs[4][1];
              for (let r = 1; r < 5; r++) { simState[idxByThreat[r]].ourP1 = pairs[r - 1][0]; simState[idxByThreat[r]].ourP2 = pairs[r - 1][1]; }
            }
            drawSim();
          }

          function drawSim() {
            const rowsEl = document.getElementById("sim-rows");
            const sumEl = document.getElementById("sim-summary");
            const rivalOpts = [...new Set([...slots.map(s => s.primary_pair), ...rivalPairs.map(r => r.pair_name)])].filter(Boolean);
            const probs = [];
            let expectedPts = 0;

            rowsEl.innerHTML = simState.map((st, idx) => {
              const calc = winProb(st.ourP1, st.ourP2, st.rivalPair);
              probs.push(calc.prob);
              expectedPts += calc.prob;
              const pct = Math.round(calc.prob * 100);
              const h2hTxt = checkH2H(st.ourP1, st.ourP2, st.rivalPair);
              const diffStr = calc.diff >= 0 ? `+${calc.diff.toFixed(0)}` : `${calc.diff.toFixed(0)}`;
              return `
                <div class="sim-row">
                  <div><span class="pos-badge">${esc(st.pos)}</span></div>
                  <div>
                    <div style="font-size:11px;font-weight:700;color:var(--text-light);margin-bottom:3px">RIVAL (${esc(m.team_name)})</div>
                    <select class="sim-select" data-sim-rival="${idx}">
                      ${rivalOpts.map(rp => `<option value="${esc(rp)}" ${rp === st.rivalPair ? "selected" : ""}>${esc(rp)} (ELO ${rivalPairElo(rp).toFixed(0)})</option>`).join("")}
                    </select>
                  </div>
                  <div>
                    <div style="font-size:11px;font-weight:700;color:var(--accent-text);margin-bottom:3px">NUESTRA PAREJA (${esc(m.our_team)})</div>
                    <div class="sim-pair-selectors">
                      <select class="sim-select" data-sim-p1="${idx}">${sortedOurs.map(p => `<option value="${esc(p.name)}" ${p.name === st.ourP1 ? "selected" : ""}>${esc(p.name)} (${(p.elo||0).toFixed(0)})</option>`).join("")}</select>
                      <select class="sim-select" data-sim-p2="${idx}">${sortedOurs.map(p => `<option value="${esc(p.name)}" ${p.name === st.ourP2 ? "selected" : ""}>${esc(p.name)} (${(p.elo||0).toFixed(0)})</option>`).join("")}</select>
                    </div>
                  </div>
                  <div class="sim-pred">
                    <div><strong>${pct}%</strong> prob. ganar · <span style="color:${calc.diff >= 0 ? "var(--accent-text)" : "var(--danger-text)"};font-weight:700">Δ ${diffStr} ELO</span></div>
                    <div class="sim-prob-bar"><div class="sim-prob-fill" style="width:${pct}%"></div></div>
                    <div style="font-size:11px;color:var(--text-light)">Nosotros ${calc.ourElo.toFixed(0)} vs ${calc.rivElo.toFixed(0)}</div>
                    ${h2hTxt ? `<div class="h2h-mini">H2H: ${esc(h2hTxt)}</div>` : ""}
                  </div>
                </div>
              `;
            }).join("");

            const winSeriePct = Math.round(seriesWinProb(probs) * 100);
            sumEl.innerHTML = `
              <div><div style="font-size:11px;text-transform:uppercase;color:#93c5fd;font-weight:700">Proyección (${esc(seasonLbl)})</div><div class="sim-score-big">${esc(m.our_team)} ${expectedPts.toFixed(1)} – ${(5 - expectedPts).toFixed(1)} ${esc(m.team_name)}</div></div>
              <div style="margin-left:auto;text-align:right"><div style="font-size:11px;text-transform:uppercase;color:#93c5fd;font-weight:700">Probabilidad de ganar (≥3 pts)</div><div class="sim-score-big" style="color:${winSeriePct >= 50 ? "#86efac" : "#fca5a5"}">${winSeriePct}%</div></div>
            `;

            rowsEl.querySelectorAll("[data-sim-rival]").forEach(sel => sel.addEventListener("change", (e) => { simState[Number(e.target.dataset.simRival)].rivalPair = e.target.value; drawSim(); }));
            rowsEl.querySelectorAll("[data-sim-p1]").forEach(sel => sel.addEventListener("change", (e) => { simState[Number(e.target.dataset.simP1)].ourP1 = e.target.value; drawSim(); }));
            rowsEl.querySelectorAll("[data-sim-p2]").forEach(sel => sel.addEventListener("change", (e) => { simState[Number(e.target.dataset.simP2)].ourP2 = e.target.value; drawSim(); }));
          }

          document.getElementById("btn-mirror").addEventListener("click", () => applySuggestion("mirror"));
          document.getElementById("btn-sacrifice").addEventListener("click", () => applySuggestion("sacrifice"));
          document.getElementById("btn-copy-wa").addEventListener("click", () => {
            const lines = [`🎾 *Alineación propuesta ${m.our_team} vs ${m.team_name}* (${m.category} · ${seasonLbl})`, ""];
            simState.forEach(st => {
              const c = winProb(st.ourP1, st.ourP2, st.rivalPair);
              lines.push(`*${st.pos}:* ${st.ourP1} / ${st.ourP2}  🆚  _${st.rivalPair}_ (${Math.round(c.prob*100)}%)`);
            });
            navigator.clipboard?.writeText(lines.join("\n"));
            const btn = document.getElementById("btn-copy-wa");
            const prev = btn.textContent;
            btn.textContent = "✅ ¡Copiada!";
            setTimeout(() => btn.textContent = prev, 1800);
          });
          drawSim();
        }
      }

      renderAll();
    })(REPORT_DATA);
  </script>
</body>
</html>
