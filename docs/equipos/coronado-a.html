            <div class="subcard">
              <h3>Comparativa por temporada (TOL)</h3>
              <div class="table-wrap">
                <table class="data-table">
                  <thead><tr><th>Métrica</th>${data.season_comparison.map(sc => `<th class="num">${esc(sc.season)}</th>`).join("")}</tr></thead>
                  <tbody>
                    <tr><td>Jornadas (G–P)</td>${data.season_comparison.map(sc => `<td class="num"><strong>${sc.jornadas_w}–${sc.jornadas_l}</strong></td>`).join("")}</tr>
                    <tr><td>Dobles (G–P)</td>${data.season_comparison.map(sc => `<td class="num">${sc.matches_w}–${sc.matches_l}</td>`).join("")}</tr>
                    <tr><td>Efectividad</td>${data.season_comparison.map(sc => `<td class="num"><strong>${sc.indiv_eff.toFixed(1)}%</strong></td>`).join("")}</tr>
                    <tr><td>Sets (G–P · %)</td>${data.season_comparison.map(sc => `<td class="num">${sc.sets_w}–${sc.sets_l} (${sc.set_ave.toFixed(1)}%)</td>`).join("")}</tr>
                    <tr><td>Games (G–P · %)</td>${data.season_comparison.map(sc => `<td class="num">${sc.games_w}–${sc.games_l} (${sc.game_ave.toFixed(1)}%)</td>`).join("")}</tr>
                    <tr><td>Súper Tie-Breaks</td>${data.season_comparison.map(sc => `<td class="num">${sc.stb_w}–${sc.stb_l} (${sc.stb_eff.toFixed(0)}%)</td>`).join("")}</tr>
                    <tr><td>Jornadas 3–2 (G–P)</td>${data.season_comparison.map(sc => `<td class="num">${sc.close_w}–${sc.close_l}</td>`).join("")}</tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>

        <section class="section" id="sec-parejas">
          <div class="section-header">
            <div><h2>Parejas y Rotaciones</h2><div class="section-subtitle">Química de duplas y mapa de calor de posiciones por jugador</div></div>
            <div class="filter-pills" id="pairs-season-filter">
              <button class="filter-btn active" data-season="${esc(m.current_season)}">${esc(m.current_season)}</button>
              <button class="filter-btn" data-season="ALL">Todas</button>
            </div>
          </div>
          <div class="table-wrap" style="margin-bottom:20px">
            <table class="data-table">
              <thead><tr><th>Pareja</th><th>Posiciones</th><th class="num">PJ</th><th class="num">G–P</th><th>Efectividad</th><th class="num">Dif. Games</th><th>Perfil</th></tr></thead>
              <tbody id="pairs-tbody"></tbody>
            </table>
          </div>
          <h3 style="font-size:15px;font-weight:800;color:var(--primary);margin-bottom:10px">Mapa de posiciones por jugador (${esc(m.current_season)})</h3>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>Jugador</th><th class="center">D1</th><th class="center">D2</th><th class="center">D3</th><th class="center">D4</th><th class="center">D5</th><th class="num">Total</th></tr></thead>
              <tbody>
                ${data.position_heatmap.map(row => {
                  const cell = (val) => {
                    if (!val) return `<td class="center" style="color:#cbd5e1">—</td>`;
                    const alpha = Math.min(0.15 + val * 0.16, 0.85);
                    const color = alpha > 0.48 ? "#ffffff" : "#0f2c59";
                    return `<td class="center"><span class="hm-cell" style="display:inline-block;min-width:30px;padding:3px 7px;background:rgba(15,44,89,${alpha.toFixed(2)});color:${color}">${val}</span></td>`;
                  };
                  return `<tr><td><strong>${esc(row.name)}</strong></td>${cell(row.D1)}${cell(row.D2)}${cell(row.D3)}${cell(row.D4)}${cell(row.D5)}<td class="num"><strong>${row.total}</strong></td></tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        </section>

        <footer class="footer">Reporte standalone generado automáticamente · Fuentes: TOL (EpicenterSport) &amp; CTA</footer>
      `;

      // Interactivity 1: Jornadas Tabs
      const allSeasons = [...new Set(data.jornadas.map(j => j.season))];
      let activeJornadaSeason = allSeasons.includes(m.current_season) ? m.current_season : (allSeasons[0] || "");
      let activeJornadaIdx = 0;

      const jFilterEl = document.getElementById("jornada-season-filter");
      jFilterEl.innerHTML = allSeasons.map(s => `<button class="filter-btn ${s === activeJornadaSeason ? "active" : ""}" data-season="${esc(s)}">${esc(s)}</button>`).join("");

      function renderJornadasUI() {
        const filtered = data.jornadas.filter(j => j.season === activeJornadaSeason);
        if (activeJornadaIdx >= filtered.length) activeJornadaIdx = 0;
        const tabsEl = document.getElementById("jornada-tabs");
        tabsEl.innerHTML = filtered.map((j, idx) => `
          <button class="jornada-tab ${idx === activeJornadaIdx ? "active" : ""}" data-idx="${idx}">
            <div class="jornada-tab-top"><span>${esc(j.round)}</span><span class="tab-pill ${j.result}">${j.result} ${j.score_for}–${j.score_against}</span></div>
            <div class="jornada-tab-opp">vs ${esc(j.opponent)}</div>
            <div class="jornada-tab-date">${esc(j.date)}</div>
          </button>
        `).join("");
        tabsEl.querySelectorAll(".jornada-tab").forEach(btn => btn.addEventListener("click", () => { activeJornadaIdx = Number(btn.dataset.idx); renderJornadasUI(); }));
        const detailEl = document.getElementById("jornada-detail");
        detailEl.innerHTML = filtered[activeJornadaIdx] ? renderMatchCard(filtered[activeJornadaIdx], m.team_name) : `<p class="footnote">No hay jornadas registradas.</p>`;
      }
      jFilterEl.querySelectorAll(".filter-btn").forEach(btn => btn.addEventListener("click", () => {
        activeJornadaSeason = btn.dataset.season; activeJornadaIdx = 0;
        jFilterEl.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active"); renderJornadasUI();
      }));
      renderJornadasUI();

      // Interactivity 2: Players Accordion + Search + Sort
      let playerSeasonMode = "ALL", playerSearchText = "", playerSortField = "eff", playerSortAsc = false;
      const expandedPlayers = new Set();

      function getPlayerMetrics(p) {
        if (playerSeasonMode === "ALL") return { pj: p.pj_all, v: p.v_all, eff: p.eff_all, history: p.history };
        const h = p.history.filter(x => x.season === playerSeasonMode);
        const pj = h.length, v = h.filter(x => x.result === "V").length;
        return { pj, v, eff: pj ? (v / pj) * 100 : 0, history: h };
      }

      function renderPlayersTable() {
        const tbody = document.getElementById("players-tbody");
        const q = playerSearchText.trim().toLowerCase();
        let rows = data.players.map(p => ({ p, st: getPlayerMetrics(p) }));
        if (playerSeasonMode !== "ALL") rows = rows.filter(x => x.st.pj > 0);
        if (q) {
          rows = rows.filter(({ p }) => [p.name, p.cedula, p.cta ? `${p.cta.club} ${p.cta.category}` : "", p.fixed_partner_note || "", p.tactical_note || ""].join(" ").toLowerCase().includes(q));
        }
        rows.sort((a, b) => {
          let va, vb;
          if (playerSortField === "name") { va = a.p.name; vb = b.p.name; }
          else if (playerSortField === "pj") { va = a.st.pj; vb = b.st.pj; }
          else if (playerSortField === "v") { va = a.st.v; vb = b.st.v; }
          else if (playerSortField === "elo") { va = a.p.elo || 0; vb = b.p.elo || 0; }
          else { va = a.st.eff; vb = b.st.eff; }
          if (va === vb) return (b.p.elo || 0) - (a.p.elo || 0);
          if (typeof va === "string") return playerSortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
          return playerSortAsc ? va - vb : vb - va;
        });

        tbody.innerHTML = rows.map(({ p, st }) => {
          const isOpen = expandedPlayers.has(p.id);
          const ctaBadge = p.cta && p.cta.verified ? `<span class="tag tag-cta">${esc(p.cta.category)} · #${p.cta.ranking}</span>` : `<span class="tag tag-rot">Sin cruce</span>`;
          const ctaDetail = p.cta && p.cta.verified
            ? `<div class="cta-box"><h4>CTA · Perfil verificado (${esc(p.cta.match_method)})</h4><div><strong>Club:</strong> ${esc(p.cta.club)} · <strong>Categoría:</strong> ${esc(p.cta.category)} · <strong>Ranking CTA:</strong> #${p.cta.ranking} (${p.cta.points} pts)</div>${p.tactical_note ? `<div style="margin-top:6px;color:var(--text-muted)">${esc(p.tactical_note)}</div>` : ""}</div>`
            : `<div class="cta-box unverified"><h4>CTA · Club actual</h4><div>Cruce con CTA no verificado para este jugador.${p.tactical_note ? " " + esc(p.tactical_note) : ""}</div></div>`;
          const historyHtml = st.history.map(h => `
            <div class="history-item">
              <span class="res-badge ${h.result}">${h.result}</span>
              <div><strong>${esc(h.round)}</strong><br><span style="color:var(--text-light)">${esc(h.date)} · ${esc(h.season)}</span></div>
              <div style="font-family:var(--mono);font-weight:700">${esc(h.score_str)}</div>
              <div><strong>vs ${esc(h.opp_pair)}</strong><div style="color:var(--text-light)">Compañero: <strong>${esc(h.partner)}</strong> · Rival: ${esc(h.rival_team)}</div></div>
              <span class="pos-badge">${esc(h.pos)}</span>
            </div>
          `).join("");

          return `
            <tr class="player-row ${isOpen ? "expanded" : ""}" data-pid="${esc(p.id)}">
              <td><strong>${esc(p.name)}</strong>${p.is_debutant ? ' <span class="tag tag-fixed">Debut</span>' : ""}</td>
              <td style="font-family:var(--mono);color:var(--text-muted)">${esc(p.cedula)}</td>
              <td>${ctaBadge}</td>
              <td class="num">${st.pj}</td>
              <td class="num">${st.v}</td>
              <td><div class="eff-bar-wrap"><div class="eff-bar-track"><div class="eff-bar-fill ${pctClass(st.eff)}" style="width:${st.eff.toFixed(0)}%"></div></div><strong>${st.eff.toFixed(0)}%</strong></div></td>
              <td class="num"><strong>${p.elo ? p.elo.toFixed(2) : "—"}</strong></td>
              <td class="center"><span class="chevron">›</span></td>
            </tr>
            <tr class="player-detail-row ${isOpen ? "open" : ""}">
              <td colspan="8" class="player-detail-cell">
                <div class="player-drawer">
                  ${ctaDetail}
                  ${p.fixed_partner_note ? `<div class="partner-pill">🤝 ${esc(p.fixed_partner_note)}</div>` : ""}
                  <div>
                    <h4 style="font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-light);margin-bottom:8px">TOL — Historial de partidos (${st.history.length})</h4>
                    <div class="history-list">${historyHtml || '<p class="footnote">Sin partidos registrados.</p>'}</div>
                  </div>
                </div>
              </td>
            </tr>
          `;
        }).join("");

        tbody.querySelectorAll(".player-row").forEach(tr => tr.addEventListener("click", () => {
          const pid = tr.dataset.pid;
          if (expandedPlayers.has(pid)) expandedPlayers.delete(pid); else expandedPlayers.add(pid);
          renderPlayersTable();
        }));
      }

      document.getElementById("player-search").addEventListener("input", (e) => { playerSearchText = e.target.value; renderPlayersTable(); });
      document.querySelectorAll("#player-season-filter .filter-btn").forEach(btn => btn.addEventListener("click", () => {
        playerSeasonMode = btn.dataset.season;
        document.querySelectorAll("#player-season-filter .filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active"); renderPlayersTable();
      }));
      document.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
        const f = th.dataset.sort;
        if (playerSortField === f) playerSortAsc = !playerSortAsc; else { playerSortField = f; playerSortAsc = (f === "name"); }
        renderPlayersTable();
      }));
      renderPlayersTable();

      // Interactivity 3: Pairs
      let pairsSeasonMode = m.current_season;
      function renderPairsTable() {
        const list = pairsSeasonMode === "ALL" ? data.pairs_all : data.pairs_current;
        const tbody = document.getElementById("pairs-tbody");
        tbody.innerHTML = list.map(pr => {
          const tags = [];
          if (pr.pj >= 3) tags.push(`<span class="tag tag-fixed">Pareja Fija</span>`);
          if (pr.pj >= 2 && pr.l === 0) tags.push(`<span class="tag tag-unbeaten">Invicta</span>`);
          if (!tags.length) tags.push(`<span class="tag tag-rot">Rotación</span>`);
          const gd = pr.game_diff >= 0 ? `+${pr.game_diff}` : `${pr.game_diff}`;
          return `<tr><td><strong>${esc(pr.pair_name)}</strong></td><td>${pr.positions.map(pos => `<span class="pos-badge" style="margin-right:4px">${esc(pos)}</span>`).join("")}</td><td class="num">${pr.pj}</td><td class="num"><strong>${pr.w}–${pr.l}</strong></td><td><div class="eff-bar-wrap"><div class="eff-bar-track"><div class="eff-bar-fill ${pctClass(pr.eff)}" style="width:${pr.eff.toFixed(0)}%"></div></div><strong>${pr.eff.toFixed(0)}%</strong></div></td><td class="num" style="color:${pr.game_diff >= 0 ? "var(--accent-text)" : "var(--danger-text)"};font-weight:700">${gd}</td><td>${tags.join(" ")}</td></tr>`;
        }).join("") || `<tr><td colspan="7" class="center" style="color:var(--text-light)">Sin datos de parejas.</td></tr>`;
      }
      document.querySelectorAll("#pairs-season-filter .filter-btn").forEach(btn => btn.addEventListener("click", () => {
        pairsSeasonMode = btn.dataset.season;
        document.querySelectorAll("#pairs-season-filter .filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active"); renderPairsTable();
      }));
      renderPairsTable();
    })(REPORT_DATA);
  </script>
</body>
</html>
